name: Frontend Quality

on:
  push:
    paths:
      - "t-events-frontend/**"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    paths:
      - "t-events-frontend/**"
      - ".github/workflows/frontend-quality.yml"

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t-events-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: t-events-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check text hygiene
        run: npm run check:text

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
